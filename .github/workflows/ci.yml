name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  SHELLCHECK_VERSION: 0.11.0
  SHFMT_VERSION: 3.14.1

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install ShellCheck and shfmt
        run: |
          curl -fsSL -o /tmp/shellcheck.tar.xz \
            "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          tar -xJf /tmp/shellcheck.tar.xz -C /tmp
          sudo install -m 755 "/tmp/shellcheck-v${SHELLCHECK_VERSION}/shellcheck" /usr/local/bin/shellcheck
          curl -fsSL -o /tmp/shfmt \
            "https://github.com/mvdan/sh/releases/download/v${SHFMT_VERSION}/shfmt_v${SHFMT_VERSION}_linux_amd64"
          sudo install -m 755 /tmp/shfmt /usr/local/bin/shfmt
          shellcheck --version
          shfmt --version

      - name: ShellCheck
        run: shellcheck -x bin/termux-sleepless install.sh tests/run-tests.sh

      - name: shfmt
        run: shfmt -d -i 4 -ci bin/termux-sleepless install.sh tests/run-tests.sh

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Run the test suite
        run: bash tests/run-tests.sh

      - name: Install, use and remove the command
        run: |
          tmp=$(mktemp -d)
          bash install.sh --prefix "$tmp"
          bash "$tmp/bin/termux-sleepless" --version
          bash install.sh --prefix "$tmp" --uninstall
          test ! -e "$tmp/bin/termux-sleepless"

  package:
    name: Package
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Build the release tarball
        run: make dist

      - name: Check the checksum
        working-directory: dist
        run: sha256sum -c ./*.sha256

      - name: Unpack the tarball and run its tests
        run: |
          tar -xzf dist/termux-sleepless-*.tar.gz
          cd termux-sleepless-*/
          bash tests/run-tests.sh
