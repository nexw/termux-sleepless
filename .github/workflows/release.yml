name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  SHELLCHECK_VERSION: 0.11.0
  SHFMT_VERSION: 3.14.1

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Install ShellCheck and shfmt
        run: |
          curl -fsSL -o /tmp/shellcheck.tar.xz \
            "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          tar -xJf /tmp/shellcheck.tar.xz -C /tmp
          sudo install -m 755 "/tmp/shellcheck-v${SHELLCHECK_VERSION}/shellcheck" /usr/local/bin/shellcheck
          curl -fsSL -o /tmp/shfmt \
            "https://github.com/mvdan/sh/releases/download/v${SHFMT_VERSION}/shfmt_v${SHFMT_VERSION}_linux_amd64"
          sudo install -m 755 /tmp/shfmt /usr/local/bin/shfmt

      - name: Match the tag with VERSION
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(sed -n "s/^VERSION='\([^']*\)'$/\1/p" bin/termux-sleepless)
          if [ -z "$version" ]; then
            echo "error: could not read VERSION from bin/termux-sleepless" >&2
            exit 1
          fi
          if [ "$tag" != "$version" ]; then
            echo "error: tag $GITHUB_REF_NAME does not match VERSION=$version" >&2
            exit 1
          fi
          echo "Releasing $version"

      - name: Lint
        run: make lint

      - name: Test
        run: make test

  release:
    name: Build and publish
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Build the release tarball
        run: make dist

      - name: Check the checksum
        working-directory: dist
        run: sha256sum -c ./*.sha256

      - name: Show the artifacts
        run: ls -l dist

      - name: Publish the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.sha256
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            Built by GitHub Actions from the tagged commit.

            Verify the download before installing:

            ```sh
            sha256sum -c termux-sleepless-*.tar.gz.sha256
            tar -xzf termux-sleepless-*.tar.gz
            cd termux-sleepless-*/
            ./install.sh
            ```
